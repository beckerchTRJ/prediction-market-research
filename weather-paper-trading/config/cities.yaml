# Kalshi daily-high-temperature markets and their OFFICIAL settlement station.
#
# Each Kalshi high-temp series settles on a specific NWS Climatological Report
# (CLI product), confirmed from the series `settlement_sources` metadata. The
# `issuedby` code in that CLI product IS the ASOS station whose local-calendar-day
# maximum grades the market. Coordinates below are that exact station — NOT a
# generic city centroid — because the high can differ by several °F across a metro
# (e.g. Central Park vs LaGuardia; Austin-Bergstrom vs Camp Mabry; Denver Intl is
# ~25 mi NE of downtown). Getting the station wrong silently biases every bucket
# probability, so this is treated as load-bearing.
#
# Settlement P&L still reads Kalshi's authoritative `result`; coordinates only
# affect forecast/model accuracy.

cities:
  NY:
    name: New York — Central Park (KNYC)
    series: KXHIGHNY
    station: KNYC
    cli: "OKX/NYC"
    lat: 40.7790
    lon: -73.9693
    tz: America/New_York
    live_enabled: true
  CHI:
    name: Chicago — Midway (KMDW)
    series: KXHIGHCHI
    station: KMDW
    cli: "LOT/MDW"
    lat: 41.7842
    lon: -87.7553
    tz: America/Chicago
    live_enabled: true
  MIA:
    name: Miami — Intl (KMIA)
    series: KXHIGHMIA
    station: KMIA
    cli: "MFL/MIA"
    lat: 25.7906
    lon: -80.3164
    tz: America/New_York
    live_enabled: true
